services:
  - type: web
    name: newra-news-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && pnpm turbo build --filter @newranews/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        # `llama-3.1-8b-instant` foi deprecado pelo Groq (shutdown 16/08/2026) — substituto: openai/gpt-oss-20b
        value: openai/gpt-oss-20b
      - key: JOB_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CRON_SCHEDULE
        value: "0 8 * * *"
      - key: CRON_TIMEZONE
        value: America/Sao_Paulo
      - key: RESEND_API_KEY
        sync: false
      - key: SITE_URL
        value: https://newra-news-web.vercel.app
      # Endereco publico da API. So o documento OpenAPI o usa — sem ele o
      # `servers` anunciava `http://0.0.0.0:3001`, que e o bind e nao e
      # endereco de ninguem (achado da revisao 9.1).
      - key: API_PUBLIC_URL
        value: https://newra-news-api.onrender.com
      - key: NEWSLETTER_FROM
        sync: false
      # Segredo compartilhado com o frontend: o web assina o JWT, a API valida.
      # DEVE ser identico ao AUTH_JWT_SECRET da Vercel.
      #
      # **Estava configurado a mao no painel desde 16/08 e nao estava aqui.** O
      # servico atual funciona; recriado a partir deste blueprint, ele subiria
      # com o health check verde e **toda rota de conta em 401** — o
      # `verifyAuthJwt` falha fechado, entao o sintoma seria um servico saudavel
      # cujo login nao funciona. Achado da revisao 11.7.
      - key: AUTH_JWT_SECRET
        sync: false
      # E-mails que nascem com role ADMIN (separados por virgula). Mesma
      # historia: configurado a mao, ausente do blueprint. Sem ele, ninguem tem
      # acesso ao painel — e nada acusa, porque o default e string vazia.
      - key: ADMIN_EMAILS
        sync: false
      # Nivel do log estruturado (fatal|error|warn|info|debug|trace|silent).
      # Declarado com valor para poder ser baixado a `debug` pelo painel durante
      # uma investigacao, sem deploy — e devolvido a `info` depois.
      - key: LOG_LEVEL
        value: info
