services:
  - type: web
    name: newra-news-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && pnpm turbo build --filter @newranews/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        # `llama-3.1-8b-instant` foi deprecado pelo Groq (shutdown 16/08/2026) — substituto: openai/gpt-oss-20b
        value: openai/gpt-oss-20b
      - key: JOB_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CRON_SCHEDULE
        value: "0 8 * * *"
      - key: CRON_TIMEZONE
        value: America/Sao_Paulo
      - key: RESEND_API_KEY
        sync: false
      - key: SITE_URL
        value: https://newra-news-web.vercel.app
      # Endereco publico da API. So o documento OpenAPI o usa — sem ele o
      # `servers` anunciava `http://0.0.0.0:3001`, que e o bind e nao e
      # endereco de ninguem (achado da revisao 9.1).
      - key: API_PUBLIC_URL
        value: https://newra-news-api.onrender.com
      - key: NEWSLETTER_FROM
        sync: false
