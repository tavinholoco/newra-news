name: Keep-alive

# **Mantém a API acordada de dia, e deixa dormir de madrugada.**
#
# O plano free do Render não cobra requisição — cobra **tempo de instância
# ligada**: 750 horas por mês, por workspace, zerando no dia 1º. O serviço dorme
# sozinho depois de ~15 min sem tráfego.
#
# Até 31/08/2026 o keep-alive era um monitor do UptimeRobot pingando a cada
# 5 min, **o tempo todo**. Como 5 < 15, o serviço nunca dormia — e um serviço
# que nunca dorme consome 24 h/dia:
#
#     24 h × 31 dias = 744 h   contra o teto de 750 h
#     folga do mês inteiro = 6 h (0,8%)
#
# Em 29/08/2026 as horas acabaram e o Render suspendeu a API até o dia 1º. O
# site continuou de pé — as telas de leitura são estáticas com ISR —, mas
# congelado no conteúdo daquele dia, com a `/news` sem carregar e três
# briefings em 500.
#
# ## A janela, e por que estas horas
#
# **06:00–00:00 BRT** (09:00–02:59 UTC). Dezoito horas ligada, seis dormindo.
#
#     18,25 h × 31 dias ≈ 566 h   contra o teto de 750 h
#     folga ≈ 184 h (25%)
#
# (18,25 e não 18: depois do último ping o serviço ainda fica ~15 min de pé.)
#
# - **O pipeline diário cai dentro da janela.** Ele roda às 11:00 UTC (08:00
#   BRT), então encontra a API já acordada e não paga cold start.
# - **A madrugada é quando ninguém lê.** Quem chegar às 3h pega ~5 s de espera
#   na `/news` — e só nela: Home, briefing e página de notícia são estáticas com
#   ISR, então o cold start bate na revalidação, não em quem está lendo.
#
# ## Por que aqui, e não no UptimeRobot
#
# Janela de horário no UptimeRobot é **recurso pago** (o free só pausa à mão).
# Este repositório é público, e para repositório público o GitHub Actions é
# gratuito e sem teto de minutos — então a janela cabe aqui, versionada e
# revisável, sem depender de configuração em painel de terceiro.
#
# **O agendamento do GitHub atrasa, e aqui isso é aceitável.** Workflow agendado
# pode sair minutos depois do horário, ou ser pulado sob carga. Para um
# keep-alive isso custa um cold start para quem chegar na janela perdida —
# não é gate, não reprova nada. **Gatilho para trocar por um serviço de cron
# dedicado (cron-job.org e afins):** se a `/news` começar a abrir fria em
# horário comercial com frequência que incomode.

on:
  schedule:
    # 09:00–23:59 UTC = 06:00–20:59 BRT
    - cron: '*/10 9-23 * * *'
    # 00:00–02:59 UTC = 21:00–23:59 BRT (a janela cruza a meia-noite UTC)
    - cron: '*/10 0-2 * * *'
  workflow_dispatch:

# Um ping de cada vez. Se uma execução atrasar e encavalar na seguinte, a que
# interessa é a mais nova — a antiga já não mede nada.
concurrency:
  group: keep-alive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    name: Acordar a API
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /api/health
        # **Nunca reprova.** A API estar fora não é falha deste workflow, e um
        # workflow que fica vermelho todo dia é um workflow que se aprende a
        # ignorar — quem vigia disponibilidade é o monitor, não isto aqui.
        # `--max-time 60` cobre o pior cold start medido (4,9 s) com folga larga.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            https://newra-news-api.onrender.com/api/health || echo 000)
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "API acordada." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "API respondeu $code — pode estar suspensa ou em deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
