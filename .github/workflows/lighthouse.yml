name: Lighthouse CI

# Auditoria de performance/acessibilidade/best-practices/SEO contra a produção
# (critério do PRD §18: Lighthouse >90). Roda semanalmente e sob demanda.
# O workflow falha se alguma categoria cair abaixo de 90 (ver .lighthouserc.json).
#
# As rotas auditadas são apenas as de URL estável. As páginas de detalhe
# (`/news/[id]` e `/article/[date]`) ficam de fora de propósito: os ids de
# notícia são removidos pelo estágio de cleanup do pipeline e a data do artigo
# muda todo dia, então qualquer URL fixa viraria 404 — o que faria o workflow
# falhar por um motivo que não é regressão de qualidade. Esses dois templates
# são cobertos pela baseline visual (plano V2 §30).

on:
  schedule:
    - cron: '0 9 * * 1' # segunda-feira 09:00 UTC
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse vs produção
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          # `runs` precisa vir por aqui: a action sempre passa --numberOfRuns
          # para o lhci a partir deste input (default 1), sobrescrevendo o
          # numberOfRuns do .lighthouserc.json. Três execuções por URL para o
          # score reportado ser a mediana, não uma amostra só.
          runs: 3
          temporaryPublicStorage: false

      # Os scores não aparecem em nenhum lugar do log da action — sem este passo
      # o workflow só diz "passou". O manifest traz a execução representativa
      # (a mediana) de cada URL.
      - name: Print scores
        if: always()
        run: |
          if [ ! -f .lighthouseci/manifest.json ]; then
            echo 'Nenhum manifest em .lighthouseci/ — o collect não produziu relatórios.'
            exit 0
          fi
          {
            echo '| Rota | Performance | Acessibilidade | Best practices | SEO |'
            echo '|---|---|---|---|---|'
            jq -r '.[] | select(.isRepresentativeRun) |
              "| \(.url) | \(.summary.performance * 100 | round) | \(.summary.accessibility * 100 | round) | \(.summary["best-practices"] * 100 | round) | \(.summary.seo * 100 | round) |"' \
              .lighthouseci/manifest.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Sem este passo os relatórios morrem com o runner e sobra apenas o
      # pass/fail. `include-hidden-files` é obrigatório: o upload-artifact ignora
      # caminhos ocultos por padrão, e `.lighthouseci` começa com ponto.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
