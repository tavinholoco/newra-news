name: Lighthouse CI

# Auditoria de performance/acessibilidade/best-practices/SEO contra a produção
# (critério do PRD §18: Lighthouse >90). Roda semanalmente e sob demanda.
# O workflow falha se alguma categoria cair abaixo de 90 (ver .lighthouserc.json)
# — o que passou a ser verdade em 21/08, quando `configPath` entrou nos inputs
# da action e a fase de assert começou a rodar de fato. Ver o comentário lá.
#
# **O workflow aquece a produção antes de medir**, e não é zelo: a API roda no
# plano free do Render e hiberna com ~15 min sem tráfego, então a primeira
# requisição a uma página que a consulta paga o custo de acordá-la. Sem o
# aquecimento o gate mede o deploy, não a página — ver o comentário do passo.
#
# **As duas páginas de detalhe entraram no gate em 24/08, e antes não estavam.**
# O motivo antigo estava escrito aqui e era metade certo: uma URL **fixa** para
# `/news/[id]` ou `/article/[date]` apodrece — o cleanup do pipeline remove a
# notícia aos 30 dias e a data do artigo muda todo dia —, e um 404 faria o
# workflow reprovar por um motivo que não é regressão de qualidade.
#
# Só que a conclusão não seguia da premissa. O problema é a URL fixa, não a rota
# ser imensurável, e o passo "Resolve the two detail routes" resolve uma URL viva
# na hora — o workflow já falava com a API para aquecer. Ficar de fora custava
# caro: são **as duas páginas por onde se chega ao site** vindo de busca ou de
# rede social, as duas mais pesadas em first-load JS (166–167 kB), e as duas cuja
# renderização a Fase 11 mudou de `ƒ` para `●` — uma correção de performance que
# o gate não conseguia ver.
#
# Se a API não responder, a resolução é pulada e o gate mede as cinco rotas
# estáveis. Gate que reprova por não conseguir montar uma URL seria a mesma
# armadilha do cold start, em outra forma.

# **A hora mudou em 31/08/2026, com a janela do keep-alive.** Ela era 09:00 UTC,
# que passou a ser exatamente o minuto em que a janela abre — medir no instante
# em que a API está acordando é a armadilha do cold start de novo, e um gate que
# reprova por motivo alheio é um gate que se aprende a ignorar.
#
# 12:00 UTC (09:00 BRT) resolve duas coisas de uma vez: está no meio da janela,
# e vem **depois** do pipeline das 11:00 UTC — então o que se mede é o conteúdo
# do dia, não o da véspera.
on:
  schedule:
    - cron: '0 12 * * 1' # segunda-feira 12:00 UTC (09:00 BRT)
  workflow_dispatch:

# Ele mede produção e escreve o resumo na própria execução. Nada no repositório.
permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse vs produção
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Uma URL viva para cada template de detalhe, montada na hora.
      #
      # O `|| true` e o teste de vazio são o ponto: **a ausência de uma URL
      # nunca reprova o gate**. Sem API, sem acervo ou com o formato de resposta
      # mudado, o passo avisa e as cinco rotas estáveis seguem sozinhas — medir
      # cinco é pior que medir sete, e muito melhor que reprovar por não ter
      # conseguido montar um endereço.
      - name: Resolve the two detail routes
        run: |
          api=https://newra-news-api.onrender.com/api
          site=https://newra-news-web.vercel.app

          news_id=$(curl -sS --max-time 20 "$api/news?limit=1" | jq -r '.data[0].id // empty' || true)
          article_date=$(curl -sS --max-time 20 "$api/articles?limit=1" | jq -r '.data[0].date // empty' || true)
          article_date=${article_date:0:10}

          if [ -n "$news_id" ]; then
            jq --arg u "$site/pt-BR/news/$news_id" '.ci.collect.url += [$u]' \
              .lighthouserc.json > rc.tmp && mv rc.tmp .lighthouserc.json
            echo "detalhe de notícia: /pt-BR/news/$news_id"
          else
            echo "detalhe de notícia: NÃO RESOLVIDO — medindo sem ele"
          fi

          if [ -n "$article_date" ]; then
            jq --arg u "$site/pt-BR/article/$article_date" '.ci.collect.url += [$u]' \
              .lighthouserc.json > rc.tmp && mv rc.tmp .lighthouserc.json
            echo "briefing do dia: /pt-BR/article/$article_date"
          else
            echo "briefing do dia: NÃO RESOLVIDO — medindo sem ele"
          fi

      # Aquecer antes de medir, ou o gate mede o **deploy** e não a página.
      #
      # A API roda no plano free do Render, que hiberna com ~15 min sem
      # tráfego. As páginas que a consultam (`/pt-BR` e `/en` chamam `getHome`)
      # regeneram a ISR sob demanda, e a requisição que dispara a regeneração
      # espera a API acordar — medido: **4,9 s na primeira passada, 0,22 s na
      # terceira**. Nessa condição a performance cai para ~81, doze pontos
      # abaixo do piso.
      #
      # O sintoma migra: em duas execuções seguidas em 22 e 23/08, o 81 saiu
      # primeiro na `/en` e depois na `/pt-BR` — sempre na que estava fria. Isso
      # é medição de infraestrutura, não de qualidade, e fazia o gate semanal
      # reprovar por um motivo que não é regressão.
      #
      # O `CLAUDE.md` mandava aquecer à mão desde a Fase 6. Passo que depende de
      # alguém lembrar não roda na segunda às 09:00 — este passo é o mecanismo.
      #
      # `-f` para o passo falhar se uma rota estiver quebrada: aquecer um 500
      # em silêncio e depois medi-lo daria um score ruim sem explicação.
      - name: Warm production before measuring
        run: |
          urls=$(jq -r '.ci.collect.url[]' .lighthouserc.json)
          for pass in 1 2; do
            for url in $urls; do
              code=$(curl -sS -f -o /dev/null -w '%{http_code} %{time_total}s' "$url") \
                && echo "passada $pass  $url  $code"
            done
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          # `runs` precisa vir por aqui: a action sempre passa --numberOfRuns
          # para o lhci a partir deste input (default 1), sobrescrevendo o
          # numberOfRuns do .lighthouserc.json. Três execuções por URL para o
          # score reportado ser a mediana, não uma amostra só.
          runs: 3
          # `configPath` é o que liga a fase de **assert**. A action lê o
          # `.lighthouserc.json` sozinha para descobrir as URLs do collect, mas
          # só executa `lhci assert` quando recebe `configPath` ou `budgetPath`
          # como input — sem isto o bloco `assert` do rc é decorativo.
          #
          # Ele era. O log da execução de 21/08 tem os grupos "Collecting" e
          # "Uploading" e nenhum "Asserting", e a execução passou com a home em
          # 78 de performance, 12 pontos abaixo do piso de 90 que este arquivo
          # dizia impor desde que foi escrito.
          # O `.lighthouserc.json` fixa `aggregationMethod: median` nas quatro
          # categorias, e isso não é detalhe de configuração.
          #
          # O padrão do LHCI é **otimista**: com 3 execuções por URL, ele confere
          # a **melhor** delas. A tabela do passo "Print scores" imprime a
          # execução *representativa*. São dois números diferentes, e em
          # 24/08/2026 eles discordaram na cara: a `/news` mediu
          # `[89, 90, 81]` — o relatório imprimiu **81**, o gate conferiu **90**,
          # e a execução passou **verde nove pontos abaixo do piso**.
          #
          # É o mesmo defeito do item 32 numa segunda forma: lá o gate media
          # cold start em vez de página, aqui ele mede a melhor amostra em vez
          # da típica. Gate que só sabe passar não é gate.
          configPath: ./.lighthouserc.json
          temporaryPublicStorage: false

      # Os scores não aparecem em nenhum lugar do log da action — sem este passo
      # o workflow só diz "passou". O manifest traz a execução representativa
      # (a mediana) de cada URL.
      - name: Print scores
        if: always()
        run: |
          if [ ! -f .lighthouseci/manifest.json ]; then
            echo 'Nenhum manifest em .lighthouseci/ — o collect não produziu relatórios.'
            exit 0
          fi
          {
            echo '| Rota | Performance | Acessibilidade | Best practices | SEO |'
            echo '|---|---|---|---|---|'
            jq -r '.[] | select(.isRepresentativeRun) |
              "| \(.url) | \(.summary.performance * 100 | round) | \(.summary.accessibility * 100 | round) | \(.summary["best-practices"] * 100 | round) | \(.summary.seo * 100 | round) |"' \
              .lighthouseci/manifest.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Sem este passo os relatórios morrem com o runner e sobra apenas o
      # pass/fail. `include-hidden-files` é obrigatório: o upload-artifact ignora
      # caminhos ocultos por padrão, e `.lighthouseci` começa com ponto.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
