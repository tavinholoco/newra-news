name: Lighthouse CI

# Auditoria de performance/acessibilidade/best-practices/SEO contra a produção
# (critério do PRD §18: Lighthouse >90). Roda semanalmente e sob demanda.
# O workflow falha se alguma categoria cair abaixo de 90 (ver .lighthouserc.json)
# — o que passou a ser verdade em 21/08, quando `configPath` entrou nos inputs
# da action e a fase de assert começou a rodar de fato. Ver o comentário lá.
#
# **O workflow aquece a produção antes de medir**, e não é zelo: a API roda no
# plano free do Render e hiberna com ~15 min sem tráfego, então a primeira
# requisição a uma página que a consulta paga o custo de acordá-la. Sem o
# aquecimento o gate mede o deploy, não a página — ver o comentário do passo.
#
# As rotas auditadas são apenas as de URL estável. As páginas de detalhe
# (`/news/[id]` e `/article/[date]`) ficam de fora de propósito: os ids de
# notícia são removidos pelo estágio de cleanup do pipeline e a data do artigo
# muda todo dia, então qualquer URL fixa viraria 404 — o que faria o workflow
# falhar por um motivo que não é regressão de qualidade. Esses dois templates
# são cobertos pela baseline visual (plano V2 §30).

on:
  schedule:
    - cron: '0 9 * * 1' # segunda-feira 09:00 UTC
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse vs produção
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Aquecer antes de medir, ou o gate mede o **deploy** e não a página.
      #
      # A API roda no plano free do Render, que hiberna com ~15 min sem
      # tráfego. As páginas que a consultam (`/pt-BR` e `/en` chamam `getHome`)
      # regeneram a ISR sob demanda, e a requisição que dispara a regeneração
      # espera a API acordar — medido: **4,9 s na primeira passada, 0,22 s na
      # terceira**. Nessa condição a performance cai para ~81, doze pontos
      # abaixo do piso.
      #
      # O sintoma migra: em duas execuções seguidas em 22 e 23/08, o 81 saiu
      # primeiro na `/en` e depois na `/pt-BR` — sempre na que estava fria. Isso
      # é medição de infraestrutura, não de qualidade, e fazia o gate semanal
      # reprovar por um motivo que não é regressão.
      #
      # O `CLAUDE.md` mandava aquecer à mão desde a Fase 6. Passo que depende de
      # alguém lembrar não roda na segunda às 09:00 — este passo é o mecanismo.
      #
      # `-f` para o passo falhar se uma rota estiver quebrada: aquecer um 500
      # em silêncio e depois medi-lo daria um score ruim sem explicação.
      - name: Warm production before measuring
        run: |
          urls=$(jq -r '.ci.collect.url[]' .lighthouserc.json)
          for pass in 1 2; do
            for url in $urls; do
              code=$(curl -sS -f -o /dev/null -w '%{http_code} %{time_total}s' "$url") \
                && echo "passada $pass  $url  $code"
            done
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          # `runs` precisa vir por aqui: a action sempre passa --numberOfRuns
          # para o lhci a partir deste input (default 1), sobrescrevendo o
          # numberOfRuns do .lighthouserc.json. Três execuções por URL para o
          # score reportado ser a mediana, não uma amostra só.
          runs: 3
          # `configPath` é o que liga a fase de **assert**. A action lê o
          # `.lighthouserc.json` sozinha para descobrir as URLs do collect, mas
          # só executa `lhci assert` quando recebe `configPath` ou `budgetPath`
          # como input — sem isto o bloco `assert` do rc é decorativo.
          #
          # Ele era. O log da execução de 21/08 tem os grupos "Collecting" e
          # "Uploading" e nenhum "Asserting", e a execução passou com a home em
          # 78 de performance, 12 pontos abaixo do piso de 90 que este arquivo
          # dizia impor desde que foi escrito.
          configPath: ./.lighthouserc.json
          temporaryPublicStorage: false

      # Os scores não aparecem em nenhum lugar do log da action — sem este passo
      # o workflow só diz "passou". O manifest traz a execução representativa
      # (a mediana) de cada URL.
      - name: Print scores
        if: always()
        run: |
          if [ ! -f .lighthouseci/manifest.json ]; then
            echo 'Nenhum manifest em .lighthouseci/ — o collect não produziu relatórios.'
            exit 0
          fi
          {
            echo '| Rota | Performance | Acessibilidade | Best practices | SEO |'
            echo '|---|---|---|---|---|'
            jq -r '.[] | select(.isRepresentativeRun) |
              "| \(.url) | \(.summary.performance * 100 | round) | \(.summary.accessibility * 100 | round) | \(.summary["best-practices"] * 100 | round) | \(.summary.seo * 100 | round) |"' \
              .lighthouseci/manifest.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Sem este passo os relatórios morrem com o runner e sobra apenas o
      # pass/fail. `include-hidden-files` é obrigatório: o upload-artifact ignora
      # caminhos ocultos por padrão, e `.lighthouseci` começa com ponto.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: warn
