name: Diag prod probe (temporary)

# Sonda descartável, só leitura: GET em rotas públicas da API e da Vercel,
# para diagnosticar a Home servindo o conteúdo de 01/10 em 02/10/2026.
# Roda só no push desta branch de trabalho; sai do repositório depois.
on:
  push:
    branches: [claude/wonderful-thompson-g79mo3]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          api=https://newra-news-api.onrender.com/api
          site=https://newra-news-web.vercel.app
          echo "now: $(date -u +%FT%TZ)"
          echo "== health"; curl -sS --max-time 60 "$api/health"; echo
          echo "== articles/latest"; curl -sS --max-time 30 "$api/articles/latest" | jq -c '.data | {id,date,createdAt,generatedAt,aiProvider,newsCount,title}' || true
          echo "== articles?limit=3"; curl -sS --max-time 30 "$api/articles?limit=3" | jq -c '.data[] | {date,createdAt,title}' || true
          echo "== news?limit=8"; curl -sS --max-time 30 "$api/news?limit=8" | jq -c '.data[] | {publishedAt,createdAt,source,title:(.title[0:60])}' || true
          echo "== home"; curl -sS --max-time 30 "$api/home" | jq -c '.data | (keys), {lead:(.lead|{publishedAt,createdAt,title:(.title//""|.[0:60])}?), article:(.article|{date,title}?)}' || true
          echo "== home raw (trimmed)"; curl -sS --max-time 30 "$api/home" | jq -c '.data' | head -c 1500; echo
          echo "== metrics/weekly"; curl -sS --max-time 30 "$api/metrics/weekly" | head -c 1500; echo
          for p in /pt-BR /en /pt-BR/article /pt-BR/news /pt-BR/article/2026-10-02; do
            echo "== HEAD $site$p"
            curl -sS -o /dev/null -D - --max-time 30 "$site$p" | grep -iE '^(HTTP|age|date|x-vercel-cache|x-nextjs|cache-control)' || true
          done
          echo "== home html: article links and dates"
          curl -sS --max-time 30 "$site/pt-BR" > home.html
          grep -oE '/pt-BR/article/20[0-9-]{8}' home.html | sort | uniq -c
          grep -oE '(0[0-9]|[12][0-9]|3[01]) de (set|out)\. de 2026' home.html | sort | uniq -c
          grep -oE '"generatedAt":"[^"]*"|"date":"[^"]*"' home.html | sort | uniq -c | head -20
