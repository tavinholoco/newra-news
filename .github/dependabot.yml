version: 2

# **O outro lado do `pnpm audit` do CI.**
#
# Os dois olham para o mesmo conjunto e fazem coisas opostas de propósito: o
# `audit` **reprova o merge** quando aparece advisory *high* em dependência de
# produção, e o Dependabot **propõe a atualização** — de tudo, produção e
# desenvolvimento. É essa divisão que deixa o `audit` rodar com `--prod` sem que
# `eslint@8` e `vitest@2` fiquem sem ninguém olhando.
#
# **Agrupado, e não é preferência de estilo.** Sem agrupar, uma semana ruim abre
# quinze PRs, cada um disparando o CI inteiro — e a resposta humana a quinze PRs
# de bump é fechar todos. Agrupado por ecossistema, é um PR para ler.
#
# ## `target-branch: dev`, e sem isto o robô fura a política do projeto
#
# **Sem `target-branch`, o Dependabot abre contra o branch padrão do
# repositório — que aqui é a `main`.** E a `main` é o que está no ar: a política
# escrita no `CLAUDE.md` é que trabalho entra por PR na **`dev`** e a `main` só
# recebe promoção deliberada.
#
# Isso não é hipótese. Em **09/09/2026**, quatro PRs de bump (#174, #169, #171 e
# #170) foram mergeados direto na `main`, pulando a `dev` e o preview da Vercel:
# cada um disparou Smoke E2E e **um deploy de produção**, e um deles subiu
# `@base-ui/react` e `@tanstack/react-query` — dependências de produção — sem
# nunca passar por uma branch de integração. As duas branches divergiram no
# mesmo dia em que tinham sido alinhadas.
#
# **O risco que isto fecha tem data marcada:** a Fase 4 do plano de
# observabilidade traz uma migration, e o `migrate.yml` dispara em **todo push
# na `main`**. Um PR do robô mergeado naquela janela aplicaria schema em
# produção sem ninguém ter pedido.
#
# **E o campo só vale quando este arquivo está na branch padrão.** O Dependabot
# lê a configuração da `main`, não da branch em que a correção foi feita: a
# versão de 09/09 entrou pela `dev` e ficou lá, e em **14/09/2026** o robô
# abriu seis PRs contra a `main` de novo (#186–#191) — cinco majors que não
# podem entrar e um bump de action inofensivo, todos fechados. Mudança neste
# arquivo pede um PR **na `main`** só com ele, sem esperar a promoção; se
# voltar a aparecer PR de bump com base `main`, é a versão da `main` que está
# velha, não a da `dev`.

updates:
  # As actions. É a metade que o `pnpm audit` não alcança de jeito nenhum, e a
  # que mais importa depois desta fase: com tudo fixado em SHA, **o Dependabot
  # passa a ser o único mecanismo que move os SHAs** — e ele atualiza o
  # comentário da versão junto, que é o que a armadilha 20 do §17 pede.
  - package-ecosystem: github-actions
    directory: '/'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns:
          - '*'

  # O `npm` cobre o monorepo inteiro a partir da raiz: o Dependabot lê o
  # `pnpm-workspace.yaml` e alcança `apps/*` e `packages/*` sem uma entrada por
  # pacote.
  #
  # **`next` e `fastify` ficam de fora, e é a dívida escrita.** As duas majors
  # arrastam trabalho de fase inteira — `next@15` leva `next-intl` 3 → 4 e
  # `params` assíncrono em 15 páginas; `fastify@5` é dívida da Fase 13. Um PR
  # semanal propondo as duas seria um PR semanal fechado sem ler, e é assim que
  # se ensina a ignorar o robô. As advisories delas estão aceitas por escrito em
  # `docs/security-advisories.md`, com gatilho.
  - package-ecosystem: npm
    directory: '/'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: next
        update-types: ['version-update:semver-major']
      - dependency-name: fastify
        update-types: ['version-update:semver-major']
      # **Duas que se juntaram em 09/09/2026, e pelo mesmo argumento de cima:
      # major que não pode entrar vira PR semanal fechado sem ler.** A primeira
      # era `@fastify/helmet`, hoje coberta pelo padrão `@fastify/*` abaixo.
      #
      # `prisma@7` não é bump, é migração de configuração: o `datasource.url`
      # deixou de ser aceito no schema (P1012), a URL vai para um
      # `prisma.config.ts` e o `PrismaClient` passa a exigir `adapter`. Alcança
      # o schema, a construção do client e o `migrate.yml` — que é o workflow
      # com a credencial mais poderosa do repositório. Gatilho: trabalho
      # próprio, depois da Fase 4 fechar.
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      # **Cinco que se juntaram em 14/09/2026, medidas em cinco PRs abertos e
      # fechados no mesmo dia (#187–#191).** Nenhuma é preferência: cada uma
      # reprovou o CI ou contraria uma decisão escrita, e sem esta lista o robô
      # as reabre a cada versão nova.
      #
      # `@fastify/*` inteiro, e não só o helmet. Em 09/09 foi o
      # `@fastify/helmet@13` que **não instalou** — o `checkVersion` do
      # próprio Fastify recusa: `expected '5.x' fastify version, '4.29.1' is
      # installed` —, e em 14/09 o `@fastify/cors@11` reprovou pelo mesmo
      # motivo. Todo plugin oficial acompanha a major do fastify, então o padrão
      # cobre os seis que o repositório usa e o próximo que entrar. Gatilho: os
      # sete sobem juntos, quando a `fastify@5` entrar.
      - dependency-name: '@fastify/*'
        update-types: ['version-update:semver-major']
      # `pino` é pinado em `9.14.0` de propósito (Fase 1 do plano de
      # observabilidade): o `fastify@4` traz `pino@^9`, e uma segunda cópia em
      # major diferente é o que a guarda dos serializers
      # (`server-hardening.test.ts`, via `pino.symbols`) existe para impedir.
      # O #188 passou no CI — e é justamente por isso que precisa estar aqui:
      # verde não é o mesmo que uma cópia só. Sobe junto com o fastify.
      - dependency-name: pino
        update-types: ['version-update:semver-major']
      # `eslint-config-next` acompanha a major do `next`, já ignorada acima —
      # a 16 exige Next 16, e o Next 15 já é gatilho de três dívidas.
      - dependency-name: eslint-config-next
        update-types: ['version-update:semver-major']
      # `eslint@9+` é flat config, e o `packages/eslint-config` é `.eslintrc`:
      # é migração de configuração do monorepo inteiro, não bump. Gatilho:
      # trabalho próprio, com a migração do `packages/eslint-config` junto.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # `lucide-react` 0.x → 1.x renomeia ícone (Lint, Test e Vercel
      # reprovaram no #191). É decisão da Fase 13, não do robô.
      - dependency-name: lucide-react
        update-types: ['version-update:semver-major']
      # **A segunda rodada, no mesmo 14/09/2026 — a primeira contra a `dev`,
      # com a configuração finalmente na branch certa (#194–#199).** Quatro
      # majors reprovaram o CI, e cada um acompanha uma major já decidida:
      #
      # `react`/`react-dom` (e os dois `@types`) acompanham o `next`: o Next 14
      # suporta só o React 18, e o 19 vem com o Next 15 — que já é gatilho
      # escrito acima. Lint, Test e Vercel reprovaram no #199.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      # `@types/node` acompanha o **runtime**: CI e Render rodam Node 22
      # (`.nvmrc`, `engines`), e os tipos do 26 descrevem API que ele não tem —
      # o #195 reprovou o `typecheck` em `IntervalHistogram`. Gatilho: subir o
      # Node nos três lugares, e aí os tipos vão junto.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # `typescript@7` é o compilador novo (o port nativo): muda configuração e
      # ferramental — `tsconfig`, o parser do ESLint, o `tsx` do seed. É
      # migração do monorepo inteiro, não bump; Lint, Test e Vercel reprovaram
      # no #198. Gatilho: trabalho próprio, junto com a migração do ESLint.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # `@vitejs/plugin-react@6` exige vite 6+, e o `vitest@2` traz vite 5 —
      # Test reprovou no #197. Sobe junto com o vitest, que **não** está nesta
      # lista de propósito: a major dele é um bump legítimo de ferramenta, e é
      # ela que puxa o plugin.
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      # **A terceira rodada, três minutos depois de a configuração chegar à
      # `main` pela promoção de 19/09/2026 (#215) — cinco PRs contra a `dev`,
      # três majors reprovando (#217, #218, #220).** Cada um acompanha uma
      # major já decidida ou é migração, não bump:
      #
      # `zod@4` é **dependência de produção da API**, e o
      # `fastify-type-provider-zod` da árvore não fala zod 4: toda rota com
      # schema respondeu 500 e a OpenAPI parou de gerar — **258 testes** no
      # #217. Gatilho: a migração fastify 5 + zod 4 + `fastify-type-provider-zod`
      # 7, os três juntos (a major do provider está logo abaixo). É trabalho
      # próprio: os `assertContract` e o `shared-type-contract` são a guarda
      # dessa migração.
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      # `vitest@5` exige o vite 7 (`ERR_PACKAGE_PATH_NOT_EXPORTED ./module-runner`
      # no #218), e o vite só sobe junto com o `@vitejs/plugin-react` — que está
      # logo acima. A nota acima dizia que a major do vitest era "bump legítimo"
      # e ficava fora da lista de propósito; medido, ela não sobe sozinha.
      # Gatilho: vitest + vite + plugin-react num PR só, com a suíte inteira.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      # `@typescript-eslint/*@8` exige o ESLint 9 — o plugin 8 sobre o 8.57 cai
      # com "Cannot use in operator to search for type" antes de lintar
      # (#220). Acompanha a major do `eslint`, já acima, na migração do ESLint.
      - dependency-name: '@typescript-eslint/eslint-plugin'
        update-types: ['version-update:semver-major']
      - dependency-name: '@typescript-eslint/parser'
        update-types: ['version-update:semver-major']
      # **A quarta rodada, 40 minutos depois da terceira (19/09/2026, #223 e
      # #224)** — o robô abre uma major por vez, então cada lista de ignore
      # revela a próxima que não estava nela:
      #
      # `fastify-type-provider-zod@7` exige o zod 4 (`'zod/v4/core' does not
      # provide an export named 'safeEncode'`, #224) e o fastify 5 — é o
      # terceiro membro da migração escrita no `zod`, acima. Sobe com os dois.
      - dependency-name: fastify-type-provider-zod
        update-types: ['version-update:semver-major']
      # `next-intl@4` é **dependência de produção do web** e espera um
      # subcaminho do `next` que o 14 não tem — a suíte do web caiu na
      # resolução de módulo (#223). É o lote do Next 15, já gatilho acima.
      - dependency-name: next-intl
        update-types: ['version-update:semver-major']
    groups:
      producao:
        dependency-type: production
        update-types:
          - minor
          - patch
      desenvolvimento:
        dependency-type: development
        update-types:
          - minor
          - patch
